<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prajwal G Rawal – Probability & Statistics</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white font-['Inter']">

<!-- HERO -->
<section id="home" class="min-h-screen flex items-center justify-center px-6 pt-20">
  <div class="container mx-auto grid md:grid-cols-2 gap-12 items-center">

    <!-- TEXT -->
    <div class="space-y-6 animate-fade-in">
      <h1 class="text-5xl md:text-6xl font-extrabold">
        Probability & <span class="text-blue-400">Statistics</span>
      </h1>
      <p class="text-gray-400 text-lg">
        Visualizing distributions, uncertainty & data-driven insights.
      </p>
    </div>

    <!-- GRAPH CARD -->
    <div class="relative">
      <div class="relative z-10 bg-slate-800/60 border border-slate-700 rounded-2xl p-6 backdrop-blur-xl h-[420px]">
        <canvas id="statsChart"></canvas>
      </div>

      <!-- LIGHTING ORBS -->
      <div class="absolute -top-6 -right-6 w-40 h-40 bg-blue-500/30 blur-3xl rounded-full"></div>
      <div class="absolute -bottom-6 -left-6 w-40 h-40 bg-purple-500/30 blur-3xl rounded-full"></div>
    </div>

  </div>
</section>

<!-- JS -->
<script src="js/main.js"></script>
</body>
</html>
